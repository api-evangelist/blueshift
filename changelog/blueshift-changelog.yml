generated: '2026-08-12'
method: searched
source: >-
  https://help.blueshift.com/hc/en-us/sections/53035039589267-Release-notes
  (Zendesk Help Center API), the GitHub releases API for github.com/blueshift-labs,
  and the per-page `updatedAt` timestamps ReadMe emits on every
  developer.blueshift.com reference page.
description: >-
  Blueshift publishes NO changelog for its REST API. This artifact records that
  absence honestly, and then records the dated change signals that do exist —
  product release notes for one product surface, SDK releases on GitHub, and the
  per-page revision dates carried in the API reference itself. The reference-page
  dates are the closest thing to an API changelog Blueshift offers: 79 of the 88
  reference pages were revised in April 2026 in what was clearly a single
  documentation overhaul, and six more in July 2026.

api_changelog:
  published: false
  scheme: null
  url: null
  probes:
    - url: https://developer.blueshift.com/changelog
      status: 404
    - url: https://developer.blueshift.com/changelog.rss
      status: 404
  note: >-
    The developer portal runs on ReadMe, which ships a changelog feature; it is
    not enabled. There is no version number for the API as a whole — the
    OpenAPI `info.version` is a static "1.0.0" on every operation document.

current_version:
  api: v1 (with two v2 operations)
  spec_info_version: '1.0.0'
  note: >-
    info.version is 1.0.0 on all 81 published operation documents and does not
    move, so it carries no change information.

reference_revision_signal:
  method: derived
  source: >-
    The `updatedAt` frontmatter ReadMe emits on each
    developer.blueshift.com/reference/*.md page, read across all 88 pages.
  distribution:
    - period: '2025-11'
      pages: 3
    - period: '2026-04'
      pages: 79
    - period: '2026-07'
      pages: 6
  oldest: '2025-11-26'
  newest: '2026-07-30'
  interpretation: >-
    The April 2026 cluster is a wholesale rewrite of the API reference, not 79
    independent API changes. The July 2026 pages are the genuinely recent edits.
    This is a documentation signal, not an API-change signal, and should not be
    read as 79 breaking changes.

