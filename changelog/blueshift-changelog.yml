breaking_changes:
  published: false
  note: >-
    Blueshift publishes no breaking-change register for the API. Combined with
    the absence of a deprecation policy (see lifecycle/), a consumer has no
    forward notice mechanism of any kind for the REST API.

gaps:
  - >-
    No API changelog, no API version history, and a static info.version — three
    independent reasons a consumer cannot answer "what changed since I
    integrated?".
  - >-
    The one release-notes surface that exists covers a different product
    (Launchpad) and is easy to mistake for an API changelog.
