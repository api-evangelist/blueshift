gaps:
  - No published versioning policy, so v1 versus v2 selection is guesswork.
  - No deprecation policy, no Sunset/Deprecation headers, no RFC 8594 support.
  - No public SLA or uptime commitment.
  - >-
    No API changelog. A consumer cannot tell what changed in the API between two
    dates without diffing the reference pages themselves.

