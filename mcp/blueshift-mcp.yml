source: https://help.blueshift.com/hc/en-us/articles/49714422787347-Blueshift-MCP-Server-tools-Beta
description: 'Blueshift operates an official hosted remote MCP server, in public beta, at https://app.getblueshift.com/mcp
  (US and rest of world) and https://app.eu.getblueshift.com/mcp (EU). Transport is streamable HTTP (the
  setup docs explicitly say HTTP, not SSE) and authorization is OAuth 2.0: an anonymous POST of tools/list
  returns 401 with an RFC 9728 WWW-Authenticate challenge pointing at the host''s own protected-resource
  metadata, so the live tool schemas require an authenticated introspection we do not perform. The tool
  list below is therefore captured from Blueshift''s own published tool catalogue — names, descriptions,
  categories and read/write class — and carries no inputSchema. The same 401-with-resource_metadata behaviour
  is served by api.getblueshift.com/mcp and api.eu.getblueshift.com/mcp.'
