generated: '2026-08-12'
method: derived
source: mcp/blueshift-mcp.yml (Blueshift's published MCP tool catalogue) bound against openapi/blueshift-openapi.yml
  (Blueshift's published REST OpenAPI, harvested per operation from developer.blueshift.com/reference/*.md)
description: 'Binds every tool in Blueshift''s MCP catalogue to the REST operation(s) that back it, and
  records the divergence in both directions. The live MCP tools/list is OAuth-gated, so bindings are made
  on published tool names, descriptions and categories against operation summaries and paths — never on
  an introspected schema. Confidence is set accordingly and is never higher than the evidence. The headline
  finding is that the MCP server and the REST API are largely DIFFERENT products: the MCP server is a
  read-heavy analyst surface over Blueshift''s AI, reporting, recommendation and schema features, most
  of which have no public REST operations at all, while the REST API is a write-heavy ingestion and campaign-execution
  surface that the MCP server barely touches. Only 31 of the 131 tools bind to a public operation, those
  31 reach just 25 of the 81 operations, and 56 operations have no tool at all.'
surfaces:
  openapi:
    path: openapi/blueshift-openapi.yml
    operations: 81
    gated: false
    note: Public. Harvested verbatim from the per-operation OpenAPI documents embedded in each ReadMe
      reference page.
  mcp:
    url: https://app.getblueshift.com/mcp
    gated: true
    note: OAuth 2.0. Anonymous tools/list returns 401 with an RFC 9728 challenge, so no inputSchema is
      available.
  graphql:
    present: false
    note: No GraphQL surface found on any Blueshift host.
coverage:
  mcp_tools: 131
  rest_operations: 81
  tools_bound: 31
  tools_mcp_only: 100
  operations_bound: 25
  operations_rest_only: 56
  confidence_high: 21
  confidence_medium: 5
  confidence_low: 5
  input_schemas_available: 0
