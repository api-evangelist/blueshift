                type: object
                properties:
                  message:
                    type: string
                    example: Gateway Timeout
  /api/v2/customer_campaign_activity:
    get:
      summary: Get a customer's campaign activity
      description: Returns a customer's campaign activity (sends, opens, clicks, purchases, revenue) for up to 366 days.
      tags:
      - Campaigns
      security:
      - user_api_auth: []
      parameters:
      - name: email
        in: query
        required: false
        description: Customer's email.
        schema:
          type: string
        example: jane.doe@example.com
      - name: customer_id
        in: query
        required: false
        description: Retailer/customer ID.
        schema:
          type: string
        example: cust_91455
      - name: phone_number
        in: query
        required: false
        description: Customer's phone number.
        schema:
          type: string
        example: '+14155550172'
      - name: uuid
        in: query
        required: false
        description: Customer's Blueshift UUID.
        schema:
          type: string
        example: e909605f-3eb3-4e2a-a666-648dedae5b89
      - name: start_time
        in: query
        required: true
        description: ISO8601 start of the activity window (inclusive); cannot be more than 366 days in the past.
        schema:
          type: string
          format: date-time
        example: '2026-07-01T00:00:00Z'
      - name: end_time
        in: query
        required: true
        description: ISO8601 end of the activity window (exclusive); must be on or after start_time and cannot be in the future.
        schema:
          type: string
          format: date-time
        example: '2026-07-30T23:59:59Z'
      - name: cursor
        in: query
        required: false
        description: ISO8601 pagination token from a prior response's cursor field, used to fetch older activity past the 10,000-record cap; must fall within (start_time, end_time].
        schema:
          type: string
          format: date-time
        example: '2026-07-15T08:30:00Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    description: Array of campaign activity records for the customer within the given time window.
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                          description: Type of activity — e.g. sent, delivered, open, click, purchase.
                        campaign_uuid:
                          type: string
                          description: Unique identifier of the campaign.
                        trigger_uuid:
                          type: string
                          description: Unique identifier of the trigger that fired the activity.
                        trigger_timestamp:
                          type: string
                          format: date-time
                          description: ISO8601 timestamp of when the activity occurred.
                        trigger_name:
                          type: string
                          description: Human-readable name of the trigger step.
                        trigger_type:
                          type: string
                          description: Type of trigger, e.g. emailtrigger.
                        campaign_name:
                          type: string
                          description: Human-readable name of the campaign.
                        creative_uuid:
                          type: string
                          description: Unique identifier of the creative/template used.
                        browser_type:
                          type: string
                          description: Browser used by the customer; present only on engagement actions like open or click.
                        browser_platform:
                          type: string
                          description: Operating system of the customer's device; present only on engagement actions.
                        email_domain:
                          type: string
                          description: Domain portion of the customer's email address.
                        extended_attributes:
                          type: object
                          description: Additional metadata about the activity, varies by action type.
                  total:
                    type: integer
                    description: Total number of activity records matching the query.
                  truncated:
                    type: boolean
                    description: True if results were capped at 10,000 records and a cursor should be used to fetch more.
                  date_range:
                    type: object
                    description: Echoes back the start_time and end_time used for the query.
                    properties:
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
              examples:
                with_activity:
                  summary: Customer with campaign activity
                  value:
                    activities:
                    - action: sent
                      campaign_uuid: aa075690-a173-4e1b-bfed-be504f738942
                      trigger_uuid: 62d05640-c5d8-b63d-938a-659e27369f3c
                      trigger_timestamp: '2026-07-30T12:54:31Z'
                      trigger_name: Send an email
                      trigger_type: emailtrigger
                      campaign_name: Summer Sale — Email Blast
                      creative_uuid: 9340a0c8-cc2c-4c64-b62c-e1ac0476048e
                      email_domain: example.com
                      extended_attributes:
                        bsft_template_version: 26
                        execution_key: '2026-07-30T12:54:29Z'
                    - action: delivered
                      campaign_uuid: aa075690-a173-4e1b-bfed-be504f738942
                      trigger_uuid: 62d05640-c5d8-b63d-938a-659e27369f3c
                      trigger_timestamp: '2026-07-30T12:54:37Z'
                      trigger_name: Send an email
                      trigger_type: emailtrigger
                      campaign_name: Summer Sale — Email Blast
                      creative_uuid: 9340a0c8-cc2c-4c64-b62c-e1ac0476048e
                      email_domain: example.com
                      extended_attributes:
                        bsft_template_version: 26
                        execution_key: '2026-07-30T12:54:29Z'
                    - action: open
                      campaign_uuid: aa075690-a173-4e1b-bfed-be504f738942
                      trigger_uuid: 62d05640-c5d8-b63d-938a-659e27369f3c
                      trigger_timestamp: '2026-07-30T12:54:38Z'
                      trigger_name: Send an email
                      trigger_type: emailtrigger
                      campaign_name: Summer Sale — Email Blast
                      creative_uuid: 9340a0c8-cc2c-4c64-b62c-e1ac0476048e
                      browser_type: chrome
                      browser_platform: windows
                      email_domain: example.com
                      extended_attributes:
                        bsft_template_version: 26
                        execution_key: '2026-07-30T12:54:29Z'
                        opened_by: user
                    total: 3
                    truncated: false
                    date_range:
                      start_time: '2026-07-30T12:00:00Z'
                      end_time: '2026-07-30T13:30:00Z'
                no_activity:
                  summary: Customer with no activity in the window
                  value:
                    activities: []
                    total: 0
                    truncated: false
                    date_range:
                      start_time: '2026-07-01T00:00:00Z'
                      end_time: '2026-07-29T23:59:59Z'
        '400':
          description: Bad Request - The request was invalid; see examples for specific validation error messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                  meta:
                    type: object
                    properties:
                      combine_errors:
                        type: boolean
                        example: false
                      no_toast:
                        type: boolean
                        example: false
              examples:
                missing_identifier:
                  summary: No identifier provided
                  value:
                    errors:
                    - detail: Customer identifier required (customer_id, email, phone_number, or uuid)
                    meta:
                      combine_errors: false
                      no_toast: false
                missing_start_time:
                  summary: Missing start_time
                  value:
                    errors:
                    - detail: start_time is required (ISO8601 format)
                    meta:
                      combine_errors: false
                      no_toast: false
                start_time_too_old:
                  summary: start_time more than 366 days in the past
                  value:
                    errors:
                    - detail: start_time cannot be more than 366 days in the past
                    meta:
                      combine_errors: false
                      no_toast: false
                end_time_in_future:
                  summary: end_time in the future
                  value:
                    errors:
                    - detail: end_time cannot be in the future
                    meta:
                      combine_errors: false
                      no_toast: false
                end_time_before_start_time:
                  summary: end_time before start_time
                  value:
                    errors:
                    - detail: end_time cannot be before start_time
                    meta:
                      combine_errors: false
                      no_toast: false
                invalid_date_format:
                  summary: Invalid date format
                  value:
                    errors:
                    - detail: start_time must be in ISO8601 format
                    meta:
                      combine_errors: false
                      no_toast: false
        '401':
          description: Unauthorized - API authentication failed due to an invalid or missing API key.
        '403':
          description: Forbidden - The API key does not have sufficient permissions to perform this action.
        '404':
          description: Not Found - The customer specified by the given identifier could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                  meta:
                    type: object
                    properties:
                      combine_errors:
                        type: boolean
                        example: false
                      no_toast:
                        type: boolean
                        example: false
              examples:
                customer_not_found:
                  summary: Customer not found
                  value:
                    errors:
                    - detail: User not found
                    meta:
                      combine_errors: false
                      no_toast: false
        '429':
          description: Rate limit exceeded - Too many requests
        '500':
          description: "Internal Server Error\t- Please contact blueshift for more information"
        '502':
          description: Service unavailable, please retry - Bad Gateway, re-try with exponential backoff
        '503':
          description: Service unavailable, please retry - Service Unavailable, re-try with exponential backoff
        '504':
          description: Service unavailable, please retry - Gateway Timeout, please re-try with exponential backoff
components:
  securitySchemes:
    user_api_auth:
      type: http
      scheme: basic
    event_api_auth:
      type: http
      scheme: basic
