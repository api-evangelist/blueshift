                    example: Gateway Timeout
  /api/v1/campaigns/{campaign_uuid}/update_schedule:
    patch:
      summary: Update campaign schedule
      description: Use this endpoint to update the schedule of an existing campaign.
      tags:
      - Campaigns
      security:
      - user_api_auth: []
      parameters:
      - in: path
        name: campaign_uuid
        required: true
        description: Specify the UUID of the campaign to update.
        schema:
          type: string
      requestBody:
        description: Specify the schedule details for the campaign.
        content:
          application/json:
            schema:
              type: object
              required:
              - startdate
              properties:
                startdate:
                  type: string
                  format: date-time
                  description: 'Specify the campaign start time in ISO 8601 format.


                    Default: current time (the campaign is launched immediately).'
                  example: '2024-11-01T14:02:36.000Z'
                enddate:
                  type: string
                  format: date-time
                  description: 'Specify the campaign end time in ISO 8601 format.


                    Default: null (the campaign runs forever).'
                  example: '2024-11-15T14:02:36.000Z'
                recurring_schedule:
                  type: string
                  description: 'Applicable to segment-triggered campaigns.


                    Options: daily, continuously.'
                  example: daily
                repeating_schedule_attributes:
                  type: object
                  description: For recurring campaigns. Contains recurrence config.
                  properties:
                    interval_size:
                      type: integer
                      description: Interval size for recurrence.
                      example: 1
                    interval_unit:
                      type: string
                      description: 'Unit for the interval.


                        Options: day, week, month.'
                      example: day
                    day_of_month:
                      type: string
                      description: 'Monthly recurrence type.


                        Options: nth_day, nth_weekday, last_day.'
                      example: nth_day
                    days_of_week:
                      type: array
                      items:
                        type: string
                      description: Array of weekdays for recurrence. e.g. ["mon", "wed"].
                      example:
                      - mon
                      - wed
      responses:
        '200':
          description: The schedule has been successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Bad Request - The request is invalid due to missing or incorrect parameters. This includes missing fields, invalid values, formatting issues, or conflicts such as duplicate data.
        '401':
          description: Unauthorized - API authentication failed due to an invalid or missing API key.
        '403':
          description: Forbidden - The API key does not have sufficient permissions to perform this action.
        '404':
          description: Not Found - The specified campaign was not found. Verify the campaign UUID.
        '422':
          description: Unprocessable Entity - The campaign cannot be paused due to its current status (e.g., already completed or archived). One or more scheduling parameters may be invalid (if applicable).
        '429':
          description: Too Many Requests - The request limit has been exceeded. Reduce request frequency.
        '500':
          description: Internal Server Error - An unexpected server error occurred. Contact support if the issue persists.
        '502':
          description: Bad Gateway - The server received an invalid response. Retry the request.
        '503':
          description: Service Unavailable - The service is temporarily unavailable. Try again later.
        '504':
          description: Gateway Timeout - The server took too long to respond. Retry the request with exponential backoff.
  /api/v2/campaigns.json:
    get:
      summary: List campaigns
      description: Use this endpoint to get the list of campaigns.
      tags:
      - Campaigns
      security:
      - user_api_auth: []
      parameters:
      - name: name
        description: Search for campaigns that contain the specified string in the name of the campaign.
        example: Members-only Banner
        in: query
        schema:
          type: string
      - name: email
        description: Search for campaigns created by specified author.
        example: janedoe@acme.com
        in: query
        schema:
          type: string
      - name: created_after
        description: Search for campaigns created after specified date and time.
        example: '2024-05-21T07:05:00.000Z'
        in: query
        schema:
          type: string
          format: date-time
      - name: created_before
        description: Search for campaigns created before specified date and time.
        example: '2024-05-24T07:05:00.000Z'
        in: query
        schema:
          type: string
          format: date-time
      - name: startdate
        description: Search for campaigns that started after specified date and time. If the start date is not specified, for one time campaigns, response contains only campaigns that have a start date within the last 30 days. For other campaign types, if start date is not specified, all campaigns are returned irrespective of start date.
        example: '2024-05-22T02:26:00.000Z'
        in: query
        schema:
          type: string
          format: date-time
      - name: archived
        description: Search for campaigns with specified archived status. Set as true for archived campaigns.
        example: true
        in: query
        schema:
          type: string
      - name: status
        description: Search for campaigns with specified status.
        example: launched
        in: query
        schema:
          type: string
      - name: exec_term
        description: Search for campaigns of specified type. Value can be one_time, recurring, on_going (segment triggered), transactional (event triggered), or onsite (live content).
        example: one_time
        in: query
        schema:
          type: string
      - name: per_page
        description: Specify the number of records to be returned per page
        example: 4
        in: query
        schema:
          type: string
      - name: page
        description: Specify the page number for the search results.
        example: 3
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the campaign.
                    status:
                      type: string
                      description: 'The current status of the campaign. Possible values: draft, launched, paused, completed.'
                    startdate:
                      type: string
                      format: date-time
                      description: The start date and time at which the campaign starts running.
                    created_at:
                      type: string
                      format: date-time
                      description: The timestamp when the campaign was created.
                    updated_at:
                      type: string
                      format: date-time
                      description: The timestamp when the campaign was last updated.
                    uuid:
                      type: string
                      description: The UUID of the campaign.
                    exec_term:
                      type: string
                      description: 'The campaign type. Possible values: one_time, recurring, on_going, transactional, onsite.'
                    next_execution_scheduled_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: For recurring campaigns, the next scheduled execution time.
                    archived:
                      type: boolean
                      description: Indicates if the campaign is archived.
                    holdout_percentage:
                      type: number
                      description: Specifies the campaign-level holdout percentage.
                    segment_uuid:
                      type:
                      - string
                      - 'null'
                      description: The UUID of the associated segment, if any.
                    segment_name:
                      type:
                      - string
                      - 'null'
                      description: The name of the associated segment, if any.
                    author:
                      type: string
                      description: The author of the campaign.
                    email:
                      type: string
                      description: Email address of the campaign author.
                    prioritization_label:
                      type: string
                      description: Indicates campaign prioritization override, if any.
        '400':
          description: Bad Request - The request is invalid due to missing or incorrect parameters. This includes missing fields, invalid values, formatting issues, or conflicts such as duplicate data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized - API authentication failed due to an invalid or missing API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not authorized
        '403':
          description: Forbidden - The API key does not have sufficient permissions to perform this action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
        '404':
          description: Not Found - The requested resource was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not Found
        '422':
          description: Unprocessable Entity - The request was well-formed but contains semantic errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Validation failed
        '429':
          description: Too Many Requests - The request limit has been exceeded. Reduce request frequency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too Many Requests
        '500':
          description: Internal Server Error - An unexpected server error occurred. Contact support if the issue persists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error
        '502':
          description: Bad Gateway - The server received an invalid response. Retry the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bad Gateway
        '503':
          description: Service Unavailable - The service is temporarily unavailable. Try again later.
