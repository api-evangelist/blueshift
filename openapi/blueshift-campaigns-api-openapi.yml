  /api/v1/campaigns/{campaign_type}:
    post:
      tags:
      - Campaigns
      summary: Create a campaign
      description: Use this endpoint to create a campaign and specify its attributes.
      security:
      - user_api_auth: []
      parameters:
      - in: path
        required: true
        name: campaign_type
        description: Specify how the campaign is triggered. Choose an option from the list.
        schema:
          type: string
          enum:
          - event_triggered
          - one_time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - startdate
              properties:
                name:
                  type: string
                  description: The name of the campaign.
                  example: Spring_Sale_2025_EMAIL
                author:
                  type: string
                  description: Email address of the campaign author.
                  example: marketing_manager@company.com
                launch:
                  type: boolean
                  description: "Determines if the campaign should be launched immediately (`true`) or saved as a draft (`false`). \n\n**Default**: `true`."
                  default: true
                  example: true
                startdate:
                  type: string
                  format: date-time
                  description: "Campaign start time in ISO 8601 format. \n\n**Default**: current time."
                  example: '2025-03-15T12:00:00Z'
                enddate:
                  type: string
                  format: date-time
                  description: "Campaign end time in ISO 8601 format. \n\n**Default**: Runs indefinitely. \n\n**Applicable only for event-triggered campaigns.**"
                  example: '2025-04-15T12:00:00Z'
                segment_uuid:
                  type: string
                  description: "UUID of the segment associated with this campaign. \n\n**Required only for one-time campaigns.**"
                  example: 89abc123-d456-789e-0123-45678f9a0123
                triggering_event_name:
                  type: string
                  description: "The event that triggers this campaign. Must match an **Event Attribute** in the Events dashboard.  \n\nIf left blank, the campaign is **API triggered** and can only be triggered via the **Campaign Execute API**. \n\n**Applicable only for event-triggered campaigns.**"
                  example: user_signup_confirmation
                bypass_message_limits:
                  type: boolean
                  description: "Whether to bypass messaging limits. \n\n**Default**: `false`."
                  default: false
                  example: false
                bypass_global_inclusion_segment:
                  type: boolean
                  description: "Whether to send messages to users outside the global inclusion segment. \n\n**Default**: `false`."
                  default: false
                  example: false
                skip_incrementing_user_message_limits:
                  type: boolean
                  description: "Controls whether sent messages are excluded from the user’s message counts. \n\nWhen set to `true`, messages do not count towards the user’s message limits. \n\n**Default**: `false`."
                  default: false
                  example: false
                remove_unsubscribe_from_email_headers:
                  type: boolean
                  description: "Whether to exclude unsubscribe headers from emails. \n\n**Default**: `false`."
                  default: false
                  example: false
                send_summary_emails:
                  type: string
                  description: "Email address to receive the campaign execution summary. \n\n**Applicable only for one-time campaigns.**"
                  example: campaign_summary@company.com
                send_to_unsubscribed:
                  type: boolean
                  description: "Whether to send messages to unsubscribed users. \n\n**Default**: `false`."
                  default: false
                  example: false
                journey_concurrency:
                  type: string
                  description: "Defines how often a user can enter the journey. \n\n**Options:** `once_per_lifetime`, `once_at_any_time`, `multiple`. \n\n**Default**: `multiple`."
                  enum:
                  - once_per_lifetime
                  - once_at_any_time
                  - multiple
                  default: multiple
                  example: multiple
                seed_list_uuids:
                  type: array
                  description: An array of seed list UUIDs for testing campaigns.
                  example:
                  - 123e4567-e89b-12d3-a456-426614174000
                  - 123e4567-e89b-12d3-a456-426614174001
                  - 123e4567-e89b-12d3-a456-426614174002
                  items:
                    type: string
                tag_data:
                  type: string
                  description: "Tags associated with the campaign. \n\n**Format**: `folder_name: tag1, tag2, tag3`. \n\n**Example**: `Regions:USA,Canada|Products:Electronics,Apparel`."
                  example: Regions:USA,Canada|Products:Electronics,Apparel
                triggers:
                  type: array
                  description: You can add only one trigger at a time. If you add multiple triggers, the endpoint returns an error.
                  items:
                    type: object
                    properties:
                      trigger_name:
                        type: string
                        description: Name of the trigger for reference.
                        example: Welcome Email Trigger
                      template_uuid:
                        type: string
                        description: UUID of the template linked to this trigger (email, push, SMS, etc.).
                        example: 8da0744e-141d-4c9d-85d7-c89a54ac745a
                      utm_source:
                        type: string
                        description: "UTM Source for tracking. \n\n**Default**: Set based on the account's backend configuration."
                        example: blueshift
                      utm_campaign:
                        type: string
                        description: "UTM Campaign name. \n\n**Default**: Set based on the account's backend configuration."
                        example: spring_sale_2025
                      utm_medium:
                        type: string
                        description: "UTM Medium (e.g., email, push). \n\n**Default**: Set based on the account's backend configuration."
                        example: email
                      utm_content:
                        type: string
                        description: "Identifies specific content variations within the campaign. \n\n**Default**: Set based on the account's backend configuration."
                        example: discount_offer_banner
                      utm_term:
                        type: string
                        description: "UTM Term for keyword tracking. \n\n**Default**: Set based on the account's backend configuration."
                        example: exclusive_deal
                      account_adapter_uuid:
                        type: string
                        description: "UUID of the adapter for message sending. If left blank, the trigger uses the default adapter for the channel. \n\nNot applicable for cloud app triggers. \n\n**Leave blank if using `account_adapter_liquid_expression`**."
                        example: c2102111-e660-47df-aa3e-678d71a93644
                      account_adapter_liquid_expression:
                        type: string
                        description: "Liquid expression to dynamically assign an adapter UUID. \n\n**Leave `account_adapter_uuid` blank when using this**."
                        example: '{% case user.country %}{% when ''US'' %}c2102111-e660-47df-aa3e-678d71a93644{% else %}fallback_uuid{% endcase %}'
                      from_name:
                        type: string
                        description: Sender's name for email campaigns.
                        example: Blueshift Marketing
                      from_address:
                        type: string
                        description: Sender's email address. It must match the adapter domain.
                        example: marketing@blueshift.com
                      reply_to_address:
                        type: string
                        description: Email address where replies are sent.
                        example: support@blueshift.com
                      custom_url_params:
                        type: array
                        description: Custom tracking parameters added to links.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Specify the name of the property.
                              example: region
                            value:
                              type: string
                              description: Specify the value of the property.
                              example: North America
        description: Specifications for the campaign to be created.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: The unique ID of the created campaign.
                        example: 21a5b6c7-8901-4d2e-9f3g-45678abcdef
                      name:
                        type: string
                        description: The name of the created campaign.
                        example: Spring Sale 2025
                      startdate:
                        type: string
                        format: date-time
                        description: The date and time when the campaign starts in ISO 8601 format.
