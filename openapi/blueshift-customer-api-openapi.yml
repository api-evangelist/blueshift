openapi: 3.2.0
info:
  description: These APIs will help you manage different workflows in Blueshift. Our powerful REST APIs provide an easy way to integrate your data and third party applications with Blueshift.
  version: 1.0.0
  title: Blueshift Customer API
  contact:
    email: support@getblueshift.com
servers:
- url: https://api.getblueshift.com
- url: https://api.eu.getblueshift.com
tags:
- name: Customer
  description: Blueshift hosts 360 degree customer profile for each of your users to represent all of their demographic, behavioral and engagement activity.
paths:
  /api/v1/customer_attributes/trigger_import:
    post:
      tags:
      - Customer
      summary: Trigger customer import
      description: Triggers a launched S3 customer attributes import task.
      security:
      - user_api_auth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uuid
              properties:
                uuid:
                  type: string
                  description: The UUID of the customer attributes import task. You can find the UUID in the import task URL on the Blueshift dashboard. For example, for the URL `https://app.getblueshift.com/dashboard#/app/customer/import_show/23114f03-5462-4de5-b112-d316e02650d1`, the UUID is `23114f03-5462-4de5-b112-d316e02650d1`.
                  example: 23114f03-5462-4de5-b112-d316e02650d1
            examples:
              trigger_import:
                summary: Trigger a customer attributes import
                value:
                  uuid: 23114f03-5462-4de5-b112-d316e02650d1
        description: Provide the UUID of the customer attributes import task that you want to trigger.
      responses:
        '200':
          description: The import was triggered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              examples:
                success:
                  summary: Import triggered
                  value:
                    status: ok
        '401':
          description: Unauthorized - API authentication failed due to an invalid or missing API key.
          content:
            application/json:
              example:
                message: Not authorized
        '404':
          description: Resource not found - The import task with the specified UUID was not found.
          content:
            application/json:
              example:
                errors:
                - title: error
                  detail: 'Error: Resource not found'
                meta:
                  combine_errors: false
                  no_toast: false
                  unformatted:
                    error:
                    - Resource not found
        '405':
          description: Method not allowed - The import cannot be triggered. This can occur if the import source is not Amazon S3, the import is not in launched state, or the import is already being processed.
        '429':
          description: Rate limit exceeded. Too many requests. Contact us at support@blueshift.com for recommended throughput.
        '500':
          description: Internal server error. Contact Blueshift for more information.
        '502':
          description: Service unavailable, please retry. Bad gateway.
        '503':
          description: Service unavailable, please retry.
        '504':
          description: Service unavailable, please retry. Gateway timeout.
