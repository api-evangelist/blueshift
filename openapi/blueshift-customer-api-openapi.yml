  /api/v1/customers/bulk:
    post:
      tags:
      - Customer
      summary: Bulk create/update customer
      description: Use this endpoint to create or update details of multiple customers.
      security:
      - user_api_auth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customers:
                  type: array
                  description: Specify the details of the customers that you want to create or of the customers whose details you want to update.
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      email:
                        type: string
                        example: johndoe@acme.com
                        description: Either email or customer ID are mandatory. Specify the email address of the customer that you want to create or whose details you want to update. Ensure that the email that you provide here contains less than 64 characters.
                      customer_id:
                        type: string
                        example: '6769'
                        description: Either email or customer ID are mandatory. Specify the customer ID of the customer that you want to create or whose details you want to update.
                      firstname:
                        type: string
                        example: John
                        description: Specify the firstname of the customer that you want to create or whose details you want to update.
                      lastname:
                        type: string
                        example: doe
                        description: Specify the lastname of the customer that you want to create or whose details you want to update.
                      uuid:
                        type: string
                        example: 225e6b3b-31b3-4738-b21e-80d71ac6cecc
                        description: Specify the UUID of the customer that you want to create or whose details you want to update.
                      subscription_groups:
                        type: array
                        description: Specify the user's subscription preferences.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the subscription group.
                            subscribed:
                              type: boolean
                              description: Enter `true` if the user is subscribed, or `false` if unsubscribed.
                        example:
                        - id: newsletter
                          subscribed: true
                        - id: weekly_promo
                          subscribed: false
      responses:
        '200':
          description: OK - Request processed. Check the errors array to verify all customers succeeded. Even with 200 OK, individual customers can fail if identifiers are missing.
          content:
            application/json:
              schema:
                oneOf:
                - title: Success - All customers processed
                  type: object
                  properties:
                    customers:
                      type: array
                      items: {}
                      maxItems: 0
                      description: Empty array when all customers succeeded.
                    errors:
                      type: array
                      items: {}
                      maxItems: 0
                      description: Empty array when all customers succeeded.
                  example:
                    customers: []
                    errors: []
                - title: Partial Failure - Some customers missing identifiers
                  type: object
                  properties:
                    customers:
                      type: array
                      description: Contains customer objects that failed processing.
                      items:
                        type: object
                        additionalProperties: true
                    errors:
                      type: array
                      description: Contains error details for failed customers.
                      items:
                        type: object
                        properties:
                          status:
                            type: integer
                            example: 400
                          error_data:
                            type: object
                            properties:
                              user_identifier_missing:
                                type: array
                                items:
                                  type: string
                                example:
                                - No valid identifier found
                  example:
                    customers:
                    - lastname: Williams
                      customer_id: null
                    errors:
                    - status: 400
                      error_data:
                        user_identifier_missing:
