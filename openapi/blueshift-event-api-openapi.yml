  /api/v1/event/history:
    get:
      tags:
      - Event
      summary: Get event history
      description: Retrieves up to 50 most recent successful events for the given event name, starting with the latest.
      security:
      - event_api_auth: []
      parameters:
      - in: query
        name: event_name
        required: true
        description: The name of the event for which to fetch history.
        schema:
          type: string
        example: app_install
      - in: query
        name: limit
        required: false
        description: 'Maximum number of records to return. Defaults to system limit if not specified.


          **Maximum value**: `50`.'
        schema:
          type: integer
          maximum: 50
        example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      _bsft_ts:
                        type: string
                        format: date-time
                        description: Event ingestion timestamp in ISO 8601 format.
                        example: '2025-09-17T10:26:55.000Z'
                      account_uuid:
                        type: string
                        description: UUID of the Blueshift account.
                        example: 11112222-3333-4444-5555-666677778888
                      event:
                        type: string
                        description: The event name.
                        example: app_install
                      event_uuid:
                        type: string
                        description: The unique UUID for this event occurrence.
                        example: aaaa1111-bbbb-2222-cccc-3333dddd4444
                      site:
                        type: string
                        description: The site associated with the event.
                        example: demoappsite.com
                      timestamp:
                        type: string
                        format: date-time
                        description: The event timestamp in ISO 8601 format.
                        example: '2025-09-17T10:26:54.688Z'
                      timestamp_epoch:
                        type: integer
                        description: The event timestamp in epoch seconds.
                        example: 1758104814
                      user_agent:
                        type: string
                        description: The user agent string captured for the event.
                        example: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 8 Build/ABC123)
                    additionalProperties: true
              example:
                app_install:
                - _bsft_ts: '2025-09-17T10:26:55.000Z'
                  account_uuid: 11112222-3333-4444-5555-666677778888
                  app_installed_at: '2025-09-17T10:26:54.687Z'
                  app_name: com.example.demoapp
                  app_version: 5.0.0 (42)
                  bsft_sdk_version: 5.0.0
                  country_code: US
                  device_id: abcd1234-5678-90ef-ghij-1234567890kl
                  device_manufacturer: ExampleTech
                  device_type: android
                  enable_inapp: true
                  enable_push: false
                  event: app_install
                  event_uuid: aaaa1111-bbbb-2222-cccc-3333dddd4444
                  language_code: en
                  os_name: Android 16
                  site: demoappsite.com
                  timestamp: '2025-09-17T10:26:54.688Z'
                  timestamp_epoch: 1758104814
                  user_agent: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 8 Build/ABC123)
                - _bsft_ts: '2025-09-17T06:47:22.572Z'
                  account_uuid: 11112222-3333-4444-5555-666677778888
                  app_installed_at: '2025-09-17T06:47:22.060Z'
                  app_name: com.example.demoapp
                  app_version: 5.0.0 (42)
                  bsft_sdk_version: 5.0.0
                  country_code: US
