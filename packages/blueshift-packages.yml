generated: '2026-08-12'
method: searched
source: >-
  Registry metadata endpoints (registry.npmjs.org, trunk.cocoapods.org,
  central.sonatype.com, pub.dev), the GitHub releases API for
  github.com/blueshift-labs, and Blueshift's own SDK setup documentation on
  developer.blueshift.com.
description: >-
  Blueshift's first-party client libraries are mobile SDKs, not server SDKs.
  There is no official Python, Ruby, Java, Go, PHP or .NET client for the REST
  API — server-side integration is expected to be raw HTTP, and Blueshift points
  developers at its Postman collection instead. The mobile SDKs are actively
  maintained: iOS, Android and the Android Compose artifact all shipped inside
  the last month. The two JavaScript packages are the weak spot — blueshift-js
  has not shipped since June 2023, and the React Native plugin trails the native
  SDKs it wraps by ten months.

