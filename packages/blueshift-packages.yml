cdn_distribution:
  - name: Blueshift on-site JavaScript tag
    registry: cdn
    official: true
    version: null
    published: null
    note: >-
      The web/on-site integration is a script tag Blueshift generates per
      account rather than a versioned package. The distribution is unpinned and
      floats to latest, so a consumer cannot tell which build they are running —
      recorded as a null version deliberately, not as an unchecked field.

