generated: '2026-08-12'
method: searched
source: >-
  https://developer.blueshift.com/reference/api-errors (the published status-code
  reference), enriched from the 4xx/5xx responses declared on all 81 operations
  in openapi/blueshift-openapi.yml.
description: >-
  Blueshift's error surface is status-code based, not code based. Every one of
  the 81 published operations declares 401, 500, 502, 503 and 504, and nearly
  all declare 400, 403, 404, 422 and 429 — so the error contract is unusually
  complete for a spec of this size. What it does NOT have is a stable machine
  identity: there is no error code field, no RFC 9457 problem+json, and at least
  four different JSON envelope shapes across the API. A client branching on
  anything finer than the HTTP status has to match English strings.

format: none
rfc9457: false
content_type: application/json
stable_codes: false
error_code_field: null

envelopes:
  - shape: '{"message": "<string>"}'
    usage: The dominant shape — 401, 403, 404, 422, 429, 5xx.
  - shape: '{"errors": {"<field>": ["<message>"]}}'
    usage: Field-level validation failures on 400.
    example: '{"errors": {"name": ["can''t be blank"]}}'
  - shape: '{"error": "<string>"}'
    usage: Some 400 responses, where the value reads like a code (e.g. "bad_request").
  - shape: '{"success": false, "error": "Validation failed"}'
    usage: Some 422 responses.
  - shape: '{"status": "404", "error": "Not Found"}'
    usage: >-
      Returned by the API host for unrouted paths — observed directly while
      probing https://api.getblueshift.com/sse on 2026-08-12.

problem_types:
  - status: 400
    title: Bad Request
    declared_on: 75
    detail: >-
      The request is invalid due to missing or incorrect parameters — missing
      fields, invalid values, formatting issues, or conflicts such as duplicate
      data.
    example: '{"errors": {"name": ["can''t be blank"]}}'
    remediation: >-
      Fix the request before retrying. Repeating an unmodified request produces
      the same error.
    retryable: false

  - status: 401
    title: Unauthorized
    declared_on: 81
    detail: API authentication failed due to an invalid or missing API key.
    example: '{"message": "Not authorized"}'
    remediation: >-
      Check that the API key is sent as the HTTP Basic username with an empty
      password, and that the right key class is used — the Event API key only
      works on event and supported live-content endpoints, the User API key on
      everything else. Also confirm the base URL matches the account's region.
    retryable: false

  - status: 403
    title: Forbidden
    declared_on: 74
    detail: The API key does not have sufficient permissions to perform this action.
    example: '{"message": "Permission denied"}'
    remediation: >-
      A User API key is required and can only be generated by an admin user.
    retryable: false

  - status: 404
    title: Not Found
    declared_on: 80
    detail: >-
      The requested resource was not found. Blueshift notes this can also occur
      from resource conflicts rather than a genuinely missing object.
    example: '{"message": "Campaign not found"}'
    remediation: >-
      Verify the UUID. Because Blueshift documents 404 as a possible transient
      conflict outcome, its own guidance is to retry with exponential backoff
      before concluding the resource is absent — unusual, and worth knowing.
    retryable: conditional

  - status: 405
    title: Method Not Allowed
    declared_on: 1
    detail: >-
      Raised only by the customer-attributes import trigger, when the import
      source is not Amazon S3 or the import is not in a launched state.
    remediation: Check the import configuration before retrying.
    retryable: false

  - status: 409
    title: Conflict
    declared_on: 26
    detail: >-
      The request could not be completed due to a conflict with the current
      state of the target resource.
    remediation: Retry with exponential backoff.
    retryable: true

  - status: 413
    title: Payload Too Large
    declared_on: 22
    detail: >-
      A hard batch cap was exceeded. The caps differ per endpoint — 50 customers
      per bulk customer call, 100 items per catalog call, 30 addresses per bulk
      email validation, 25 users per custom-list bulk call (500 with async=true).
    example: '{"message": "You can upload up to 50 users in an API call."}'
    remediation: Split the payload to the endpoint's documented batch size.
    retryable: false
    see: conventions/blueshift-conventions.yml

  - status: 422
    title: Unprocessable Entity
    declared_on: 72
    detail: >-
      The request was well-formed but contains semantic errors — invalid
      schedule values, a campaign in a state that forbids the transition, or
      products carrying invalid data.
    example: '{"message": "Campaign cannot be paused in its current status."}'
    remediation: >-
      Read the response body for the per-item detail; on catalog writes the
      response identifies which items failed.
    retryable: false

  - status: 429
    title: Too Many Requests
    declared_on: 79
    detail: The request limit has been exceeded.
    example: '{"message": "Rate limit exceeded"}'
    remediation: >-
      Reduce request frequency and retry with exponential backoff. No
      Retry-After header and no X-RateLimit-* headers are returned, so the
      client has to choose the backoff itself. Blueshift directs high-throughput
      users to support@blueshift.com for a recommended rate.
    retryable: true
    see: rate-limits/blueshift-rate-limits.yml

  - status: 500
    title: Internal Server Error
    declared_on: 81
    detail: An unexpected server error occurred.
    example: '{"message": "Internal Server Error - Please contact support for more information."}'
    remediation: Retry with exponential backoff; contact support if it persists.
    retryable: true

  - status: 502
    title: Bad Gateway
    declared_on: 79
    detail: The server received an invalid response.
    example: '{"message": "Bad Gateway - Please retry the request."}'
    remediation: Retry with exponential backoff.
    retryable: true

  - status: 503
    title: Service Unavailable
    declared_on: 79
    detail: The service is temporarily unavailable.
    example: '{"message": "Service Unavailable - The service is temporarily unavailable. Try again later."}'
    remediation: Retry with exponential backoff.
    retryable: true

  - status: 504
    title: Gateway Timeout
    declared_on: 79
    detail: The server took too long to respond.
    example: '{"message": "Gateway Timeout - The server took too long to respond. Retry with exponential backoff."}'
    remediation: Retry with exponential backoff.
    retryable: true

retry_policy:
  source: https://developer.blueshift.com/reference/api-errors
  strategy: exponential backoff
  schedule: 1s, 2s, 4s, 8s ...
  max_attempts: ~5
  jitter: recommended, to avoid synchronised retry storms
  applies_to: [409, 429, 500, 502, 503, 504]
  do_not_retry: 4xx other than 409 and 429 — fix the request first
  caution: >-
    Only POST /api/v1/campaigns/execute and POST /api/v1/campaigns/bulk_execute
    accept an idempotency key (the transaction_uuid body field). Every other
    write is at-least-once under this retry policy.

gaps:
  - No RFC 9457 application/problem+json representation.
  - >-
    No stable error code or error type URI — the only machine-readable
    discriminator is the HTTP status.
  - >-
    At least four different success/failure envelope shapes, so a generic error
    parser cannot be written against this API.
  - >-
    Blueshift documents 404 as sometimes transient. Without an error code, a
    client cannot distinguish "genuinely absent" from "retry me", which is the
    kind of ambiguity a stable code field exists to remove.
