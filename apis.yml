aid: blueshift
name: Blueshift
description: >-
  Blueshift is an AI-powered customer engagement and customer data platform (CDP) that unifies
  customer profiles, product and content catalogs, and behavioural event streams, then activates them
  across email, SMS, push, in-app messaging, mobile inbox, iOS Live Activities and on-site live
  content. Its public surface is a REST API on api.getblueshift.com (US) and api.eu.getblueshift.com
  (EU) covering customers, events, catalogs, segments, custom user lists, campaigns, templates,
  shared assets, promotions, external fetches, interest alerts, subscription groups and email
  validation, documented operation-by-operation with a machine-readable OpenAPI 3.0 document behind
  every reference page. Blueshift also runs an official OAuth 2.0 remote MCP server in public beta,
  and ships first-party SDKs for iOS, Android, React Native, Flutter and Cordova.
