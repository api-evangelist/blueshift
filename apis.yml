  - name: Blueshift MCP Server
    description: >-
      Official hosted remote MCP server, in public beta, exposing a catalogue of 131 tools (97 read,
      34 write) across campaigns, segments, customer profiles, catalogs, templates, shared assets,
      tags, reporting and dashboards, schema discovery, recommendations, the AI campaign optimizer,
      marketing insights and image management. Streamable HTTP transport with OAuth 2.0
      authorization; the server publishes RFC 8414 authorization-server metadata and RFC 9728
      protected-resource metadata, supports dynamic client registration and PKCE, and declares eight
      read/write scopes. Regional endpoints for US and EU. Blueshift's own catalogue marks 41 of the
      131 tools as currently published.
    humanURL: https://help.blueshift.com/hc/en-us/articles/49713147943187-The-Blueshift-MCP-Server-Beta
    baseURL: https://app.getblueshift.com/mcp
