apis:
  - name: Blueshift REST API
    description: >-
      The Blueshift REST API: 81 operations across 21 resource groups covering customer profiles and
      privacy operations (create/update, bulk, merge, forget/unforget, delete), event ingestion
      (single, bulk, summary, history, debug), product and content catalogs, segments and segment
      membership counts, custom user lists, campaign lifecycle (create, schedule, launch, pause,
      archive, trigger, bulk trigger) and campaign reporting, email/push/SMS templates and test
      sends, shared assets, external fetch templates, promotions, interest alerts, subscription
      groups, iOS Live Activities, adapters, tags and email validation. HTTP Basic authentication
      with an API key as the username and an empty password; two key classes (Event API key and User
      API key) split the surface.
    humanURL: https://developer.blueshift.com/reference/welcome
    baseURL: https://api.getblueshift.com
