overlay: 1.0.0
info:
  title: API Evangelist enhancements to the Blueshift API OpenAPI
  version: 1.0.0
extends: ../openapi/blueshift-openapi.yml
x-generated: '2026-08-12'
x-method: derived
x-source: openapi/blueshift-openapi.yml — harvested verbatim from the per-operation OpenAPI documents
  Blueshift embeds in each developer.blueshift.com/reference/*.md page
x-rationale: Blueshift publishes a genuinely good spec — every one of the 81 operations carries a summary,
  a description, tags, 4xx/5xx responses and examples — but NOT ONE operation declares an operationId.
  That single omission is what stops the spec from being usable as a code-generation or agent-tool source,
  because there is no stable name to bind a generated method or an MCP tool to. This overlay adds a deterministic
  operationId to each operation, derived from its method and path, and changes nothing else. The original
  spec is never mutated. This is the one concrete fix worth sending back to Blueshift.
actions:
- target: $.paths['/api/v1/account_adapters'].get
  description: Add the unique operationId Blueshift's published spec omits for GET /api/v1/account_adapters.
  update:
    operationId: getV1AccountAdapters
